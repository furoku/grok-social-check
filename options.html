<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Grok Social Check — 設定</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; }
      label { display: block; margin-top: 16px; font-weight: 600; }
      input, select { width: 100%; margin-top: 6px; padding: 8px; box-sizing: border-box; }
      .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
      button { padding: 10px 16px; }
      .hint { color: #536471; font-size: 13px; margin-top: 6px; line-height: 1.6; }
      #status { margin-top: 12px; font-size: 14px; min-height: 1.5em; }
      #status[data-tone="error"] { color: #b42318; }
      #status[data-tone="success"] { color: #067647; }
    </style>
  </head>
  <body>
    <h1>Grok Social Check</h1>
    <p>X / Threads の投稿を Grok で参考分析します（公式ファクトチェックではありません）。</p>

    <label for="xaiToken">xAI API キー</label>
    <input id="xaiToken" type="password" autocomplete="off" spellcheck="false" />
    <p class="hint">キーはこの端末の <code>chrome.storage.local</code> に保存し、通常のWebページから読めないようアクセス範囲を制限します。旧版の同期領域にあるキーは初回読み込み時に移行して削除します。</p>

    <label for="model">モデル</label>
    <select id="model">
      <option value="grok-4.20-0309-non-reasoning">grok-4.20-0309-non-reasoning（推奨）</option>
      <option value="grok-4.3">grok-4.3（reasoning: none）</option>
    </select>
    <p class="hint">対応モデルは2026年8月30日にxAI公式ドキュメントで確認しました。退役モデルは自動的に推奨モデルへ移行します。</p>

    <div class="actions">
      <button id="save" type="button">保存</button>
      <button id="clearKey" type="button">APIキーを削除</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <script type="module" src="options.js"></script>
  </body>
</html>
